# Adopt-verrifer-companions-
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adopter Form - Dog</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#ffffff;
    color:#111;
}

/* HEADER */

.header{
    background:#079669;
    color:white;
    text-align:center;
    padding:32px 15px;
}

.header h1{
    margin:0;
    font-size:42px;
    font-weight:bold;
}

.header p{
    margin:12px 0 0;
    font-size:20px;
}

/* CONTENT */

.container{
    max-width:1000px;
    margin:45px auto;
    padding:0 20px;
}

/* SECTIONS */

.section-title{
    background:#079669;
    color:white;
    padding:14px 24px;
    font-size:22px;
    font-weight:bold;
    margin-top:28px;
}

/* FIELDS */

.form-group{
    margin:20px 25px;
}

label{
    display:block;
    font-size:17px;
    margin-bottom:8px;
}

input,
select,
textarea{
    width:100%;
    padding:14px;
    border:1px solid #999;
    background:#f5f6f7;
    font-size:16px;
    border-radius:0;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border:2px solid #079669;
    background:white;
}

/* BUTTON */

.submit{
    width:100%;
    background:#079669;
    color:white;
    border:none;
    padding:16px;
    font-size:18px;
    font-weight:bold;
    border-radius:8px;
    cursor:pointer;
    margin-top:20px;
}

.submit:hover{
    background:#057c56;
}

/* MOBILE */

@media(max-width:600px){

    .header h1{
        font-size:28px;
    }

    .header p{
        font-size:16px;
    }

    .container{
        padding:0 12px;
        margin:25px auto;
    }

    .section-title{
        font-size:18px;
        padding:12px 15px;
    }

    .form-group{
        margin:18px 10px;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <h1>ADOPTER FORM - DOG</h1>

    <p>
        FILLABLE FORM - Type directly
    </p>

</div>

<div class="container">

<!-- FORM -->

<form action="https://formsubmit.co/farmdreamshorse@gmail.com" method="POST">

    <!-- EMAIL SETTINGS -->

    <input type="hidden" name="_subject" value="New Dog Adoption Application">

    <input type="hidden" name="_template" value="table">

    <input type="hidden" name="_captcha" value="false">


    <!-- YOUR INFORMATION -->

    <div class="section-title">
        YOUR INFORMATION
    </div>

    <div class="form-group">

        <label>Full Name</label>

        <input
            type="text"
            name="Full Name"
            placeholder="Type here..."
            required
        >

    </div>

    <div class="form-group">

        <label>ID Card Number</label>

        <input
            type="text"
            name="ID Card Number"
            placeholder="Type here..."
            required
        >

    </div>

    <div class="form-group">

        <label>WhatsApp</label>

        <input
            type="tel"
            name="WhatsApp"
            placeholder="Type here..."
            required
        >

    </div>

    <div class="form-group">

        <label>Address</label>

        <input
            type="text"
            name="Address"
            placeholder="Type here..."
            required
        >

    </div>


    <!-- YOUR HOME -->

    <div class="section-title">
        YOUR HOME
    </div>

    <div class="form-group">

        <label>House / Apartment</label>

        <input
            type="text"
            name="House / Apartment"
            placeholder="Type here..."
            required
        >

    </div>

    <div class="form-group">

        <label>Yard / Garden</label>

        <input
            type="text"
            name="Yard / Garden"
            placeholder="Type here..."
            required
        >

    </div>

    <div class="form-group">

        <label>Owner / Tenant</label>

        <select name="Housing Status" required>

            <option value="">Select...</option>

            <option value="Owner">
                Owner
            </option>

            <option value="Tenant">
                Tenant
            </option>

        </select>

    </div>


    <!-- YOUR EXPERIENCE -->

    <div class="section-title">
        YOUR EXPERIENCE
    </div>

    <div class="form-group">

        <label>Have you ever had a dog?</label>

        <select name="Previous Dog Experience" required>

            <option value="">Select...</option>

            <option value="Yes">
                Yes
            </option>

            <option value="No">
                No
            </option>

        </select>

    </div>

    <div class="form-group">

        <label>Who will take care of the dog?</label>

        <input
            type="text"
            name="Caregiver"
            placeholder="Type here..."
            required
        >

    </div>

    <div class="form-group">

        <label>How many hours will the dog be left alone?</label>

        <input
            type="text"
            name="Hours Left Alone"
            placeholder="Type here..."
            required
        >

    </div>


    <!-- COMMITMENT -->

    <div class="section-title">
        COMMITMENT
    </div>

    <div class="form-group">

        <label>
            I agree to provide proper food
        </label>

        <select name="Food Commitment" required>

            <option value="">Select...</option>

            <option value="YES">
                YES
            </option>

        </select>

    </div>

    <div class="form-group">

        <label>
            I agree to post-adoption follow-up
        </label>

        <select name="Post-adoption Follow-up" required>

            <option value="">Select...</option>

            <option value="YES">
                YES
            </option>

        </select>

    </div>


    <!-- SUBMIT BUTTON -->

    <button
        type="submit"
        class="submit"
    >
        SUBMIT
    </button>

</form>

</div>

</body>
      </html>
